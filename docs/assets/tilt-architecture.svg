  </text>
  <rect x="54" y="356" width="212" height="86" rx="10" fill="#FAF6F0" stroke="#D8CEBE"/>
  <text x="68" y="380" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#141413">
